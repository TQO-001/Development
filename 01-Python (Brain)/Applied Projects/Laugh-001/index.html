<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLI Task Manager</title>
  <style>
/* From Uiverse.io by vaibhavchandranv */ 
.card {
  font-family: Montserrat, sans-serif;
  width: 300px;
  height: 250px;
  translate: -6px -6px;
  background: #ff66a3;
  border: 3px solid #000000;
  box-shadow: 12px 12px 0 #000000;
  overflow: hidden;
  transition: all 0.3s ease;
}

.head {
  font-family: Montserrat, sans-serif;
  font-size: 14px;
  font-weight: 900;
  width: 100%;
  height: 32px;
  background: #ffffff;
  padding: 5px 12px;
  color: #000000;
  border-bottom: 3px solid #000000;
}

.content {
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 600;
}

.button {
  padding: 5px 10px;
  margin-top: 10px;
  border: 3px solid #000000;
  box-shadow: 3px 3px 0 #000000;
  font-weight: 750;
  background: #4ade80;
  transition: all 0.3s ease;
  cursor: pointer;
}

.button:hover {
  translate: 1.5px 1.5px;
  box-shadow: 1.5px 1.5px 0 #000000;
  background: #1ac2ff;
}

.button:active {
  translate: 3px 3px;
  box-shadow: 0 0 0 #000000;
}

.card:hover {
  translate: -6px;
}
  </style>
</head>
<body>

  <div id="injected-react-content"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    function MyComponent() {
      return (
        <div>
          <h1>Some HTML title</h1>
          <p>Some HTML content.</p>
        </div>
      );
    }

    function Card() {
        return (
            <div class="card">
                <div class="head">Window</div>
                <div class="content">
                    This is a neobrutalist-style window with a button and space for any content
                    you want!
                    <br />
                    <button class="button">Button</button>
                </div>
            </div>
        );
    }

    function RootComponent() {
      return (
        <div>
          <MyComponent />
          <Card />
        </div>
      );
    }

    const domContainer = document.querySelector('#injected-react-content');
    const root = ReactDOM.createRoot(domContainer);
    root.render(<RootComponent />);
  </script>

</body>
</html>
